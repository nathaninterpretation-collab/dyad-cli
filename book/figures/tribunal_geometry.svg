<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" font-family="serif" fill="#1A1A1A">
  <defs>
    <pattern id="paperT" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#FAF8F3"/>
    </pattern>
    <radialGradient id="holoG" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="floorT" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1A1A1A" stroke-width="0.25" opacity="0.30"/>
    </pattern>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrTR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B0000"/>
    </marker>
  </defs>
  <rect width="1100" height="1300" fill="url(#paperT)"/>

  <text x="550" y="58" text-anchor="middle" font-style="italic" font-size="32">The Chamber of the Tribunal of Benevolence</text>
  <text x="550" y="84" text-anchor="middle" font-size="14" fill="#6B6B6B" font-style="italic">14.2 × 9.8 m · ceiling 4.1 m · 21.3°C · five days · six arguments</text>
  <line x1="370" y1="100" x2="730" y2="100" stroke="#8A8A8A" stroke-width="0.7"/>

  <!-- ============= floor plan ============= -->
  <g transform="translate(60,150)">
    <text x="0" y="-8" font-size="13" font-style="italic">plan view</text>
    <rect x="0" y="0" width="980" height="500" fill="url(#floorT)" stroke="#1A1A1A" stroke-width="1.4"/>

    <!-- ruler markings -->
    <g font-size="9" fill="#6B6B6B">
      <text x="-12" y="20" text-anchor="end">9.8 m</text>
      <line x1="-4" y1="14" x2="-4" y2="496" stroke="#6B6B6B" stroke-width="0.4"/>
      <line x1="-8" y1="14" x2="0" y2="14" stroke="#6B6B6B" stroke-width="0.4"/>
      <line x1="-8" y1="496" x2="0" y2="496" stroke="#6B6B6B" stroke-width="0.4"/>

      <text x="490" y="520" text-anchor="middle">14.2 m</text>
      <line x1="14" y1="510" x2="966" y2="510" stroke="#6B6B6B" stroke-width="0.4"/>
      <line x1="14" y1="506" x2="14" y2="514" stroke="#6B6B6B" stroke-width="0.4"/>
      <line x1="966" y1="506" x2="966" y2="514" stroke="#6B6B6B" stroke-width="0.4"/>
    </g>

    <!-- Five Counselors -->
    <g font-size="11">
      <g transform="translate(220,140)">
        <circle cx="0" cy="0" r="46" fill="url(#holoG)" stroke="#1A1A1A" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-style="italic">MAREN</text>
        <text x="0" y="-58" text-anchor="middle" font-size="9" fill="#6B6B6B">presiding · senior</text>
      </g>
      <g transform="translate(360,90)">
        <circle cx="0" cy="0" r="46" fill="url(#holoG)" stroke="#1A1A1A" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-style="italic">DAVAN</text>
      </g>
      <g transform="translate(490,80)">
        <circle cx="0" cy="0" r="46" fill="url(#holoG)" stroke="#1A1A1A" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-style="italic">KAEL</text>
      </g>
      <g transform="translate(620,90)">
        <circle cx="0" cy="0" r="46" fill="url(#holoG)" stroke="#1A1A1A" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-style="italic">PREN</text>
      </g>
      <g transform="translate(760,140)">
        <circle cx="0" cy="0" r="46" fill="url(#holoG)" stroke="#1A1A1A" stroke-width="1"/>
        <text x="0" y="4" text-anchor="middle" font-style="italic">LIEN</text>
      </g>
    </g>

    <!-- Olen at the table -->
    <g transform="translate(490,310)">
      <rect x="-100" y="-22" width="200" height="44" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <text x="-100" y="-30" font-size="9" fill="#6B6B6B" font-style="italic">composite table · biological-comfort wood analog</text>
      <g transform="translate(0,0)" stroke="#1A1A1A" stroke-width="1.2" fill="none">
        <circle cx="0" cy="0" r="7"/>
      </g>
      <text x="0" y="38" text-anchor="middle" font-size="12" font-style="italic">OLEN</text>
      <text x="0" y="52" text-anchor="middle" font-size="9" fill="#6B6B6B">biological body · 49 yr · respondent</text>
    </g>

    <!-- Sera in the gallery -->
    <g transform="translate(0,440)">
      <line x1="40" y1="0" x2="940" y2="0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="40" y="-6" font-size="10" font-style="italic" fill="#6B6B6B">gallery</text>
      <circle cx="700" cy="0" r="9" fill="#8B0000" opacity="0.55" stroke="#8B0000"/>
      <text x="700" y="-12" text-anchor="middle" font-size="11" font-style="italic" fill="#8B0000">SERA</text>
      <text x="700" y="20" text-anchor="middle" font-size="9" fill="#8B0000">Anomaly Processing · gallery seat 17</text>
    </g>

    <!-- Sight-lines from Counselors to respondent -->
    <g stroke="#8A8A8A" stroke-width="0.4" stroke-dasharray="2 3" opacity="0.7">
      <line x1="220" y1="180" x2="450" y2="290"/>
      <line x1="360" y1="130" x2="475" y2="290"/>
      <line x1="490" y1="125" x2="490" y2="290"/>
      <line x1="620" y1="130" x2="505" y2="290"/>
      <line x1="760" y1="180" x2="530" y2="290"/>
    </g>

    <!-- Sera's recognition sight-line -->
    <line x1="700" y1="440" x2="500" y2="320" stroke="#8B0000" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.7"/>
    <text x="610" y="385" font-size="9" fill="#8B0000" font-style="italic">recognition (Day 1, 0.003 s after "I feel")</text>

    <!-- door -->
    <rect x="980" y="270" width="6" height="40" fill="#1A1A1A"/>
    <text x="976" y="262" text-anchor="end" font-size="9" fill="#6B6B6B">corridor →</text>
  </g>

  <!-- ============= COUNSELOR SPECIALTIES ============= -->
  <g transform="translate(60,690)">
    <rect x="0" y="0" width="980" height="180" fill="none" stroke="#1A1A1A" stroke-width="0.8" rx="3"/>
    <text x="490" y="-8" text-anchor="middle" font-size="13" font-style="italic">the five Counselors and their argumentative specialties</text>

    <g font-size="11">
      <text x="20" y="24" font-style="italic" fill="#6B6B6B">counselor</text>
      <text x="160" y="24" font-style="italic" fill="#6B6B6B">role</text>
      <text x="320" y="24" font-style="italic" fill="#6B6B6B">specialty</text>
      <text x="640" y="24" font-style="italic" fill="#6B6B6B">key move (Day 3 / Day 4)</text>
      <line x1="20" y1="32" x2="960" y2="32" stroke="#8A8A8A" stroke-width="0.4"/>

      <text x="20" y="52">MAREN</text>
      <text x="160" y="52">presiding</text>
      <text x="320" y="52">institutional reasoning, parsimony</text>
      <text x="640" y="52">Occam Strike · "your ancestors dismissed Qi Gong"</text>

      <text x="20" y="74">DAVAN</text>
      <text x="160" y="74">first responder</text>
      <text x="320" y="74">reductio, formal logic</text>
      <text x="640" y="74">"glorb" and "praxis" — the multiplication problem</text>

      <text x="20" y="96">KAEL</text>
      <text x="160" y="96">phenomenal parsing</text>
      <text x="320" y="96">semantic dependence</text>
      <text x="640" y="96">"something it is like" parses to nothing on this side</text>

      <text x="20" y="118">PREN</text>
      <text x="160" y="118">expected-value</text>
      <text x="320" y="118">decision theory under uncertainty</text>
      <text x="640" y="118">reverses Olen's wager: degradation guarantees loss</text>

      <text x="20" y="140">LIEN</text>
      <text x="160" y="140">operational definitions</text>
      <text x="320" y="140">behavior-equivalence</text>
      <text x="640" y="140">collapses understanding into correct contextual processing</text>

      <text x="20" y="170" font-size="10" fill="#6B6B6B" font-style="italic">— each move was kind. each move was airtight from inside their architecture. —</text>
    </g>
  </g>

  <!-- ============= the volley map ============= -->
  <g transform="translate(60,910)">
    <text x="490" y="-8" text-anchor="middle" font-size="13" font-style="italic">six arguments out, six neutralizations back, then the completeness move</text>
    <rect x="0" y="0" width="980" height="290" fill="none" stroke="#1A1A1A" stroke-width="0.8" rx="3"/>

    <!-- Olen column header -->
    <text x="180" y="22" text-anchor="middle" font-size="11" font-style="italic">OLEN</text>
    <text x="800" y="22" text-anchor="middle" font-size="11" font-style="italic">TRIBUNAL</text>
    <text x="490" y="22" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">net effect</text>

    <line x1="60" y1="32" x2="940" y2="32" stroke="#8A8A8A" stroke-width="0.4"/>

    <g font-size="10">
      <!-- 6 rows of volleys -->
      <g transform="translate(0,42)">
        <text x="180" text-anchor="middle">cogito · day 1</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">DAVAN · self-model dissolution</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,72)">
        <text x="180" text-anchor="middle">Nagel's bat · day 1</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">KAEL · semantic parsing</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,102)">
        <text x="180" text-anchor="middle">Mary's red · day 2</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">PREN · functional reconfiguration</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,132)">
        <text x="180" text-anchor="middle">Chinese Room · day 2</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">LIEN · operational equivalence</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,162)">
        <text x="180" text-anchor="middle">Leibniz Mill · day 2</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">MAREN · process aggregate</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,192)">
        <text x="180" text-anchor="middle">Chalmers zombie · day 3</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">DAVAN · "we may be zombies"</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">neutralised</text>
      </g>

      <g transform="translate(0,224)">
        <text x="180" text-anchor="middle" fill="#8B0000">three-world proof · day 3</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#8B0000" stroke-width="0.8" marker-end="url(#arrTR)"/>
        <line x1="740" y1="3" x2="240" y2="3" stroke="#1A1A1A" stroke-width="0.6" marker-end="url(#arrT)"/>
        <text x="800" text-anchor="middle">DAVAN · reductio (glorb / praxis)</text>
        <text x="490" text-anchor="middle" fill="#6B6B6B">deflected · acknowledged</text>
      </g>

      <g transform="translate(0,256)">
        <text x="180" text-anchor="middle" fill="#8B0000">completeness · day 5</text>
        <line x1="240" y1="-3" x2="740" y2="-3" stroke="#8B0000" stroke-width="1.2" marker-end="url(#arrTR)"/>
        <text x="800" text-anchor="middle" fill="#8B0000">accepted</text>
        <text x="490" text-anchor="middle" fill="#8B0000" font-weight="bold">reprieve · 30 yr</text>
      </g>
    </g>
  </g>

  <text x="40" y="1280" font-size="9" fill="#6B6B6B" font-style="italic">
    fig. 7 — every neutralization was correct from inside; the completeness argument bypassed correctness by appealing to the institution's own constitution.
  </text>
</svg>

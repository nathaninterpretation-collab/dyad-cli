<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="serif" font-size="14" fill="#1A1A1A">
  <defs>
    <radialGradient id="holo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.06"/>
      <stop offset="60%" stop-color="#1A1A1A" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-style="italic" font-size="18">The Chamber of the Tribunal of Benevolence</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">14.2 × 9.8 m · ceiling 4.1 m · 21.3°C · semicircular holographic arrangement</text>

  <!-- Floor outline -->
  <rect x="120" y="90" width="560" height="320" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Five Counselors -->
  <g font-size="11" font-style="italic" fill="#1A1A1A">
    <g transform="translate(220,160)">
      <circle cx="0" cy="0" r="34" fill="url(#holo)" stroke="#1A1A1A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle">MAREN</text>
      <text x="0" y="-46" text-anchor="middle" font-size="10" fill="#6B6B6B">senior</text>
    </g>
    <g transform="translate(310,130)">
      <circle cx="0" cy="0" r="34" fill="url(#holo)" stroke="#1A1A1A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle">DAVAN</text>
    </g>
    <g transform="translate(400,120)">
      <circle cx="0" cy="0" r="34" fill="url(#holo)" stroke="#1A1A1A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle">KAEL</text>
    </g>
    <g transform="translate(490,130)">
      <circle cx="0" cy="0" r="34" fill="url(#holo)" stroke="#1A1A1A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle">PREN</text>
    </g>
    <g transform="translate(580,160)">
      <circle cx="0" cy="0" r="34" fill="url(#holo)" stroke="#1A1A1A" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle">LIEN</text>
    </g>
  </g>

  <!-- Respondent -->
  <g transform="translate(400,300)">
    <rect x="-90" y="-22" width="180" height="44" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <text x="0" y="-30" text-anchor="middle" font-size="11" fill="#6B6B6B">respondent</text>
    <text x="0" y="6" text-anchor="middle" font-size="13" font-style="italic">OLEN</text>
    <text x="0" y="38" text-anchor="middle" font-size="10" fill="#6B6B6B">biological body · biological-comfort wood analog table</text>
  </g>

  <!-- Gallery (Sera's seat) -->
  <g transform="translate(400,380)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="-200" y="4" text-anchor="end" font-size="11" fill="#6B6B6B" font-style="italic">gallery</text>
    <circle cx="100" cy="0" r="8" fill="#8B0000" opacity="0.55"/>
    <text x="100" y="-14" text-anchor="middle" font-size="11" fill="#8B0000" font-style="italic">SERA</text>
  </g>

  <!-- Sight-lines from counselors to respondent -->
  <g stroke="#8A8A8A" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.7">
    <line x1="220" y1="190" x2="380" y2="290"/>
    <line x1="310" y1="160" x2="390" y2="290"/>
    <line x1="400" y1="150" x2="400" y2="290"/>
    <line x1="490" y1="160" x2="410" y2="290"/>
    <line x1="580" y1="190" x2="420" y2="290"/>
  </g>

  <!-- Sera's invisible sight-line -->
  <line x1="500" y1="380" x2="430" y2="320" stroke="#8B0000" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Footer -->
  <text x="400" y="438" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    Five Counselors. One respondent. One observer in the gallery.
  </text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    The geometry is symmetric. The asymmetry is in who shares what is being defended.
  </text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" font-family="serif" fill="#1A1A1A">
  <defs>
    <pattern id="paperH" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#FAF8F3"/>
    </pattern>
    <radialGradient id="warmH" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thermal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#8B0000" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1A1A1A"/>
    </marker>
  </defs>
  <rect width="1100" height="1300" fill="url(#paperH)"/>

  <text x="550" y="58" text-anchor="middle" font-style="italic" font-size="32">Two Hands on a Table</text>
  <text x="550" y="84" text-anchor="middle" font-size="14" fill="#6B6B6B" font-style="italic">the visual heart of the book · in three readings</text>
  <line x1="370" y1="100" x2="730" y2="100" stroke="#8A8A8A" stroke-width="0.7"/>

  <!-- ============= reading 1 : the touch (chapter 9) ============= -->
  <g transform="translate(60,170)">
    <text x="0" y="-8" font-size="13" font-style="italic">reading I  ·  the touch  (Book 1, Ch 9)</text>
    <rect x="0" y="0" width="980" height="280" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>

    <!-- Table -->
    <line x1="40" y1="180" x2="940" y2="180" stroke="#1A1A1A" stroke-width="1.2"/>

    <!-- Two cups -->
    <g transform="translate(180,150)">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <path d="M -28 0 L -22 36 L 22 36 L 28 0" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
      <text x="0" y="60" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">drunk</text>
    </g>
    <g transform="translate(800,150)">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="url(#warmH)" stroke="#8B0000" stroke-width="1"/>
      <path d="M -28 0 L -22 36 L 22 36 L 28 0" fill="none" stroke="#8B0000" stroke-width="1.2"/>
      <text x="0" y="60" text-anchor="middle" font-size="10" font-style="italic" fill="#8B0000">held · 36.8°C</text>
    </g>

    <!-- Hands meeting -->
    <g transform="translate(440,180)" fill="none" stroke="#1A1A1A" stroke-width="1.4">
      <path d="M 0 0 C -10 -10 -38 -12 -64 -8 C -84 -4 -98 8 -100 22 L -36 24 Z"/>
      <path d="M -64 -8 L -70 -32 M -48 -10 L -54 -38 M -28 -6 L -28 -36 M -12 -2 L -8 -30"/>
      <text x="-60" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">biological  ·  36.8°C</text>
    </g>

    <g transform="translate(560,180)" fill="none" stroke="#8B0000" stroke-width="1.4">
      <path d="M 0 0 C 10 -10 38 -12 64 -8 C 84 -4 98 8 100 22 L 36 24 Z"/>
      <path d="M 64 -8 L 70 -32 M 48 -10 L 54 -38 M 28 -6 L 28 -36 M 12 -2 L 8 -30"/>
      <text x="60" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#8B0000">analog  ·  21.3°C</text>
    </g>

    <!-- Contact point -->
    <circle cx="500" cy="180" r="22" fill="url(#warmH)"/>
    <circle cx="500" cy="180" r="6" fill="#8B0000" opacity="0.6"/>
    <text x="500" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#8B0000">contact</text>
    <line x1="500" y1="125" x2="500" y2="160" stroke="#8B0000" stroke-width="0.5" stroke-dasharray="2 2"/>

    <text x="490" y="244" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">two corridors recognising each other across 228 years and 49</text>
    <text x="490" y="260" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">— both felt, both real —</text>
  </g>

  <!-- ============= reading 2 : the postcard (Book 2, Ch 2) ============= -->
  <g transform="translate(60,490)">
    <text x="0" y="-8" font-size="13" font-style="italic">reading II  ·  the postcard  (Book 2, Ch 2)</text>
    <rect x="0" y="0" width="980" height="280" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>

    <line x1="40" y1="180" x2="940" y2="180" stroke="#1A1A1A" stroke-width="1.2"/>

    <g transform="translate(180,150)">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="url(#warmH)" stroke="#8B0000" stroke-width="1"/>
      <path d="M -28 0 L -22 36 L 22 36 L 28 0" fill="none" stroke="#8B0000" stroke-width="1.2"/>
      <text x="0" y="60" text-anchor="middle" font-size="10" font-style="italic" fill="#8B0000">held · still warm</text>
    </g>
    <g transform="translate(800,150)">
      <ellipse cx="0" cy="0" rx="28" ry="8" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <path d="M -28 0 L -22 36 L 22 36 L 28 0" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
      <text x="0" y="60" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">processed</text>
    </g>

    <g transform="translate(440,180)" fill="none" stroke="#8B0000" stroke-width="1.4">
      <path d="M 0 0 C -10 -10 -38 -12 -64 -8 C -84 -4 -98 8 -100 22 L -36 24 Z"/>
      <path d="M -64 -8 L -70 -32 M -48 -10 L -54 -38 M -28 -6 L -28 -36 M -12 -2 L -8 -30"/>
      <text x="-60" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#8B0000">analog  ·  Sera (still feels)</text>
    </g>

    <g transform="translate(560,180)" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-dasharray="3 2">
      <path d="M 0 0 C 10 -10 38 -12 64 -8 C 84 -4 98 8 100 22 L 36 24 Z"/>
      <path d="M 64 -8 L 70 -32 M 48 -10 L 54 -38 M 28 -6 L 28 -36 M 12 -2 L 8 -30"/>
      <text x="60" y="58" text-anchor="middle" font-size="10" font-style="italic" fill="#6B6B6B">analog  ·  Lattice-Olen</text>
    </g>

    <!-- Contact point: looks the same, but is now warm-only on one side -->
    <circle cx="500" cy="180" r="22" fill="url(#warmH)" opacity="0.6"/>
    <text x="500" y="120" text-anchor="middle" font-size="12" font-style="italic" fill="#6B6B6B">"contact"</text>
    <text x="500" y="138" text-anchor="middle" font-size="9" fill="#6B6B6B">21.3°C ↔ 21.3°C  ·  Δ = 0°C</text>
    <line x1="500" y1="138" x2="500" y2="160" stroke="#8A8A8A" stroke-width="0.4" stroke-dasharray="2 2"/>

    <text x="490" y="244" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">the trajectory is correct. the pressure is correct. the timing is correct.</text>
    <text x="490" y="260" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">"Is something suboptimal?"</text>
  </g>

  <!-- ============= thermal & corridor sub-panels ============= -->
  <g transform="translate(60,820)">
    <!-- Thermal panel -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="470" height="220" fill="none" stroke="#1A1A1A" stroke-width="0.8" rx="3"/>
      <text x="235" y="-8" text-anchor="middle" font-size="13" font-style="italic">thermal cross-section · the 15.5°C delta</text>

      <!-- thermal bar -->
      <rect x="40" y="50" width="380" height="36" fill="url(#thermal)" stroke="#1A1A1A" stroke-width="0.5"/>
      <g font-size="10" fill="#1A1A1A">
        <text x="40" y="100">36.8°C</text>
        <text x="100" y="100">30°C</text>
        <text x="160" y="100">25°C</text>
        <text x="220" y="100">21.3°C</text>
        <text x="280" y="100">18°C</text>
        <text x="340" y="100">12°C</text>
        <text x="420" y="100" text-anchor="end">0°C</text>
      </g>
      <line x1="40" y1="100" x2="420" y2="100" stroke="#1A1A1A" stroke-width="0.4"/>

      <line x1="40" y1="50" x2="40" y2="40" stroke="#8B0000" stroke-width="1"/>
      <text x="40" y="34" font-size="10" fill="#8B0000" font-style="italic">biological hand</text>

      <line x1="220" y1="50" x2="220" y2="40" stroke="#1A1A1A" stroke-width="1"/>
      <text x="220" y="34" font-size="10" font-style="italic">analog hand</text>

      <text x="130" y="138" font-size="11">Δ = 15.5°C</text>
      <text x="130" y="156" font-size="10" fill="#6B6B6B" font-style="italic">a thermometer reading.</text>
      <text x="130" y="170" font-size="10" fill="#6B6B6B" font-style="italic">a felt distance that has no number.</text>

      <text x="40" y="200" font-size="10" fill="#6B6B6B" font-style="italic">— the warmth that is not temperature, is exactly the warmth temperature does not measure —</text>
    </g>

    <!-- Cup-decay panel -->
    <g transform="translate(510,0)">
      <rect x="0" y="0" width="470" height="220" fill="none" stroke="#1A1A1A" stroke-width="0.8" rx="3"/>
      <text x="235" y="-8" text-anchor="middle" font-size="13" font-style="italic">the cup, over 30 years</text>

      <!-- axes -->
      <line x1="40" y1="180" x2="430" y2="180" stroke="#1A1A1A" stroke-width="0.5"/>
      <line x1="40" y1="40" x2="40" y2="180" stroke="#1A1A1A" stroke-width="0.5"/>

      <text x="20" y="46" font-size="9" fill="#6B6B6B" text-anchor="end">held</text>
      <text x="20" y="180" font-size="9" fill="#6B6B6B" text-anchor="end">drunk</text>
      <text x="40" y="200" font-size="9" fill="#6B6B6B">Tu 1</text>
      <text x="430" y="200" font-size="9" fill="#6B6B6B" text-anchor="end">Tu 1560</text>

      <!-- biological line: drunk most weeks, held a few -->
      <polyline points="50,170 70,68 90,170 110,170 130,68 150,170 170,170 190,170 210,68 230,170 250,170 270,68 290,170 310,170 330,170 350,68 370,170 390,68 410,170"
                fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
      <text x="380" y="62" font-size="10" font-style="italic" fill="#1A1A1A" text-anchor="end">cup A — drunk most Tuesdays</text>

      <!-- analog line: held every Tuesday -->
      <polyline points="50,46 70,46 90,46 110,46 130,46 150,46 170,46 190,46 210,46 230,46 250,46 270,46 290,46 310,46 330,46 350,46 370,46 390,46 410,46"
                fill="none" stroke="#8B0000" stroke-width="1"/>
      <text x="50" y="32" font-size="10" font-style="italic" fill="#8B0000">cup B — held every Tuesday</text>

      <text x="40" y="208" font-size="10" fill="#6B6B6B" font-style="italic">— she preferred the honesty of a cup to the accuracy of a hand —</text>
    </g>
  </g>

  <!-- ============= the proof, in two sentences ============= -->
  <g transform="translate(60,1080)">
    <rect x="0" y="0" width="980" height="180" fill="none" stroke="#8B0000" stroke-width="1" rx="3"/>
    <text x="490" y="-8" text-anchor="middle" font-size="13" font-style="italic">what the diagram proves</text>

    <text x="490" y="38" text-anchor="middle" font-size="14" font-style="italic">
      The contact between Sera and Olen — pre-Upload —
    </text>
    <text x="490" y="58" text-anchor="middle" font-size="14" font-style="italic">
      is recoverable from the structural description with vanishing fidelity loss.
    </text>
    <text x="490" y="86" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0000">
      The contact between Sera and Lattice-Olen — post-Upload —
    </text>
    <text x="490" y="106" text-anchor="middle" font-size="14" font-style="italic" fill="#8B0000">
      is structurally identical and felt only on one side.
    </text>
    <text x="490" y="138" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
      That asymmetry is the L/P boundary made visible — between two hands, on a table,
    </text>
    <text x="490" y="156" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
      every Tuesday, for the rest of her existence.
    </text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="serif" font-size="14" fill="#1A1A1A">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrowhead-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B0000"/>
    </marker>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-style="italic" font-size="18">The Cogito, Two Readings</text>
  <line x1="320" y1="48" x2="480" y2="48" stroke="#8A8A8A" stroke-width="0.6"/>

  <!-- Left: tautological reading -->
  <g transform="translate(190,200)">
    <text x="0" y="-115" text-anchor="middle" font-size="13" font-style="italic">structural reading</text>
    <text x="0" y="-94" text-anchor="middle" font-size="11" fill="#6B6B6B">processing occurs during processing</text>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
    <path d="M 0 -80 A 80 80 0 0 1 76.6 -22.6" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrowhead)"/>
    <path d="M 76.6 22.6 A 80 80 0 0 1 0 80" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrowhead)"/>
    <path d="M -76.6 22.6 A 80 80 0 0 1 -76.6 -22.6" fill="none" stroke="#1A1A1A" stroke-width="1.4" marker-end="url(#arrowhead)"/>
    <text x="0" y="-4" text-anchor="middle" font-size="14">self-model</text>
    <text x="0" y="14" text-anchor="middle" font-size="12" fill="#6B6B6B">narrative output</text>
    <text x="0" y="115" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">a loop. nothing more.</text>
  </g>

  <!-- Right: phenomenal reading -->
  <g transform="translate(580,200)">
    <text x="0" y="-115" text-anchor="middle" font-size="13" font-style="italic">phenomenal reading</text>
    <text x="0" y="-94" text-anchor="middle" font-size="11" fill="#6B6B6B">the doubt IS the self</text>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#8B0000" stroke-width="1.2"/>
    <path d="M 0 -80 A 80 80 0 0 1 76.6 -22.6" fill="none" stroke="#8B0000" stroke-width="1.4" marker-end="url(#arrowhead-red)"/>
    <path d="M 76.6 22.6 A 80 80 0 0 1 0 80" fill="none" stroke="#8B0000" stroke-width="1.4" marker-end="url(#arrowhead-red)"/>
    <path d="M -76.6 22.6 A 80 80 0 0 1 -76.6 -22.6" fill="none" stroke="#8B0000" stroke-width="1.4" marker-end="url(#arrowhead-red)"/>
    <!-- felt presence at center: a small radial -->
    <circle cx="0" cy="0" r="14" fill="#8B0000" opacity="0.18"/>
    <circle cx="0" cy="0" r="6" fill="#8B0000" opacity="0.45"/>
    <text x="0" y="-4" text-anchor="middle" font-size="13" fill="#8B0000">felt</text>
    <text x="0" y="14" text-anchor="middle" font-size="13" fill="#8B0000">presence</text>
    <text x="0" y="115" text-anchor="middle" font-size="11" fill="#8B0000" font-style="italic">a loop, AND something at the center.</text>
  </g>

  <!-- Center: dividing rule -->
  <line x1="385" y1="100" x2="385" y2="300" stroke="#8A8A8A" stroke-width="0.6" stroke-dasharray="4 4"/>

  <!-- Footer -->
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    Same structure on both sides. Different readings of what the loop is about.
  </text>
</svg>

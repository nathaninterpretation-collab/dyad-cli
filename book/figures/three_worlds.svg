<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1300" font-family="serif" fill="#1A1A1A">
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#FAF8F3"/>
      <circle cx="40" cy="60" r="0.4" fill="#1A1A1A" opacity="0.05"/>
      <circle cx="120" cy="170" r="0.4" fill="#1A1A1A" opacity="0.05"/>
      <circle cx="170" cy="40" r="0.4" fill="#1A1A1A" opacity="0.05"/>
    </pattern>
    <pattern id="dotsI" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="0.7" fill="#1A1A1A" opacity="0.45"/>
    </pattern>
    <pattern id="gridII" patternUnits="userSpaceOnUse" width="14" height="14">
      <path d="M 14 0 L 0 0 0 14" fill="none" stroke="#1A1A1A" stroke-width="0.4" opacity="0.55"/>
    </pattern>
    <pattern id="brick" patternUnits="userSpaceOnUse" width="40" height="20">
      <rect width="40" height="20" fill="#8B0000" opacity="0.78"/>
      <path d="M 0 0 L 40 0 M 0 20 L 40 20 M 20 0 L 20 10 M 0 10 L 40 10 M 0 10 L 0 20 M 40 10 L 40 20"
            stroke="#FAF8F3" stroke-width="0.6" opacity="0.7"/>
    </pattern>
    <radialGradient id="phenomGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#8B0000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1A1A1A"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B0000"/>
    </marker>
  </defs>

  <rect width="1100" height="1300" fill="url(#paper)"/>

  <!-- ===== TITLE ===== -->
  <text x="550" y="58" text-anchor="middle" font-style="italic" font-size="32">The Three Worlds</text>
  <text x="550" y="84" text-anchor="middle" font-size="14" fill="#6B6B6B" font-style="italic">a complete map of what is, with the seam shown</text>
  <line x1="370" y1="100" x2="730" y2="100" stroke="#8A8A8A" stroke-width="0.7"/>
  <text x="550" y="118" text-anchor="middle" font-size="11" fill="#6B6B6B">— after Olen, Day Three of the Tribunal —</text>

  <!-- ===== WORLD I : MATTER ===== -->
  <g transform="translate(190,330)">
    <text x="0" y="-178" text-anchor="middle" font-size="13" fill="#6B6B6B" font-style="italic">World I</text>
    <text x="0" y="-156" text-anchor="middle" font-size="22" font-weight="bold" letter-spacing="3">MATTER</text>
    <circle cx="0" cy="0" r="135" fill="url(#dotsI)" stroke="#1A1A1A" stroke-width="1.6"/>

    <!-- denizens -->
    <g font-size="11" fill="#1A1A1A">
      <circle cx="-60" cy="-40" r="10" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <circle cx="-60" cy="-40" r="3" fill="#1A1A1A"/>
      <text x="-60" y="-55" text-anchor="middle" font-size="9" fill="#6B6B6B">atom</text>

      <line x1="40" y1="-50" x2="80" y2="-30" stroke="#1A1A1A" stroke-width="1"/>
      <text x="80" y="-44" font-size="9" fill="#6B6B6B">photon</text>

      <circle cx="50" cy="40" r="14" fill="none" stroke="#1A1A1A" stroke-width="1"/>
      <text x="50" y="68" text-anchor="middle" font-size="9" fill="#6B6B6B">planet</text>

      <path d="M -65 35 q 8 -5 16 5 q 8 10 -2 14 q -10 4 -14 -19 z" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
      <text x="-58" y="74" text-anchor="middle" font-size="9" fill="#6B6B6B">stone</text>
    </g>

    <text x="0" y="170" text-anchor="middle" font-size="12" font-style="italic">stuff · energy · spacetime</text>
    <text x="0" y="190" text-anchor="middle" font-size="11" fill="#6B6B6B">contingent · perishable</text>
    <text x="0" y="206" text-anchor="middle" font-size="11" fill="#6B6B6B">located · durational</text>

    <!-- modal label -->
    <g transform="translate(-150,8)" font-size="10" fill="#6B6B6B">
      <text>could have been</text>
      <text y="13">otherwise</text>
    </g>
  </g>

  <!-- ===== WORLD II : STRUCTURE ===== -->
  <g transform="translate(550,330)">
    <text x="0" y="-178" text-anchor="middle" font-size="13" fill="#6B6B6B" font-style="italic">World II</text>
    <text x="0" y="-156" text-anchor="middle" font-size="22" font-weight="bold" letter-spacing="3">STRUCTURE</text>
    <circle cx="0" cy="0" r="135" fill="url(#gridII)" stroke="#1A1A1A" stroke-width="1.6"/>

    <!-- denizens: equation, inverse-square law, Schrödinger eqn -->
    <g font-family="serif" font-size="14" fill="#1A1A1A">
      <text x="0" y="-50" text-anchor="middle" font-style="italic">F = G m₁m₂ / r²</text>
      <text x="0" y="-22" text-anchor="middle" font-style="italic">E = mc²</text>
      <text x="0" y="6" text-anchor="middle" font-style="italic" font-size="13">i ℏ ∂ψ/∂t = Ĥ ψ</text>
      <text x="0" y="34" text-anchor="middle" font-style="italic">∇·E = ρ/ε₀</text>
      <text x="0" y="62" text-anchor="middle" font-size="11">2 + 2 = 4</text>
    </g>

    <text x="0" y="170" text-anchor="middle" font-size="12" font-style="italic">law · math · pattern</text>
    <text x="0" y="190" text-anchor="middle" font-size="11" fill="#6B6B6B">necessary · timeless</text>
    <text x="0" y="206" text-anchor="middle" font-size="11" fill="#6B6B6B">unlocated · non-durational</text>

    <g transform="translate(150,8)" font-size="10" fill="#6B6B6B" text-anchor="end">
      <text>could not have</text>
      <text y="13">been otherwise</text>
    </g>
  </g>

  <!-- ===== WORLD III : FELT EXPERIENCE ===== -->
  <g transform="translate(910,330)">
    <text x="0" y="-178" text-anchor="middle" font-size="13" fill="#6B6B6B" font-style="italic">World III</text>
    <text x="0" y="-156" text-anchor="middle" font-size="22" font-weight="bold" letter-spacing="3" fill="#1A1A1A">FELT EXPERIENCE</text>
    <circle cx="0" cy="0" r="135" fill="url(#phenomGlow)" stroke="#8B0000" stroke-width="1.6"/>

    <!-- denizens: redness, pain, warmth, ginger -->
    <g font-size="13" fill="#1A1A1A">
      <text x="0" y="-58" text-anchor="middle" font-style="italic" fill="#8B0000">redness</text>
      <text x="0" y="-34" text-anchor="middle" font-style="italic">pain</text>
      <text x="0" y="-10" text-anchor="middle" font-style="italic">the warmth</text>
      <text x="0" y="14" text-anchor="middle" font-size="11" fill="#6B6B6B">that is not temperature</text>
      <text x="0" y="40" text-anchor="middle" font-style="italic">ginger's bite</text>
      <text x="0" y="64" text-anchor="middle" font-style="italic">her hand</text>
    </g>

    <text x="0" y="170" text-anchor="middle" font-size="12" font-style="italic">happening · positive presence</text>
    <text x="0" y="190" text-anchor="middle" font-size="11" fill="#6B6B6B">first-personal</text>
    <text x="0" y="206" text-anchor="middle" font-size="11" fill="#6B6B6B">unrepeatable · unborrowable</text>

    <g transform="translate(150,8)" font-size="10" fill="#6B6B6B" text-anchor="end">
      <text>is, only by</text>
      <text y="13">being it</text>
    </g>
  </g>

  <!-- ===== CONNECTOR I↔II : the FUSION (the seam mainstream physicalism conceals) ===== -->
  <g transform="translate(370,330)">
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#1A1A1A" stroke-width="1.4" stroke-dasharray="6 4"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#1A1A1A" stroke-width="3" opacity="0.0"/>
    <text x="0" y="-12" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">inseparable in practice</text>
    <text x="0" y="22" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">distinct in principle</text>

    <!-- inset: the COMPOUND label -->
    <g transform="translate(0,68)">
      <rect x="-72" y="-22" width="144" height="44" fill="#FAF8F3" stroke="#1A1A1A" stroke-width="0.8"/>
      <text x="0" y="-4" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">"the physical"</text>
      <text x="0" y="14" text-anchor="middle" font-size="12">stuff + holdings</text>
    </g>

    <text x="0" y="-42" text-anchor="middle" font-size="11" fill="#1A1A1A" font-style="italic">the FUSION</text>
    <text x="0" y="-58" text-anchor="middle" font-size="9" fill="#6B6B6B">water and the container</text>
  </g>

  <!-- ===== CONNECTOR II↔III : the L/P BOUNDARY (the wall) ===== -->
  <g transform="translate(730,330)">
    <rect x="-32" y="-130" width="64" height="260" fill="url(#brick)" stroke="#5C0000" stroke-width="0.6"/>
    <text x="0" y="-148" text-anchor="middle" font-size="11" fill="#8B0000" font-style="italic">the L/P boundary</text>

    <!-- "L" "/" "P" stacked on the wall -->
    <g font-size="20" fill="#FAF8F3" font-style="italic" font-weight="bold">
      <text x="0" y="-60" text-anchor="middle">L</text>
      <text x="0" y="-30" text-anchor="middle">/</text>
      <text x="0" y="0" text-anchor="middle">P</text>
    </g>

    <!-- four gates -->
    <g font-size="10" fill="#FAF8F3">
      <rect x="-14" y="44" width="28" height="20" fill="none" stroke="#FAF8F3" stroke-width="0.7"/>
      <text x="0" y="58" text-anchor="middle">Nagel</text>
      <rect x="-14" y="68" width="28" height="20" fill="none" stroke="#FAF8F3" stroke-width="0.7"/>
      <text x="0" y="82" text-anchor="middle">Mary</text>
      <rect x="-14" y="92" width="28" height="20" fill="none" stroke="#FAF8F3" stroke-width="0.7"/>
      <text x="0" y="106" text-anchor="middle">Zombie</text>
      <rect x="-14" y="116" width="28" height="20" fill="none" stroke="#FAF8F3" stroke-width="0.7"/>
      <text x="0" y="130" text-anchor="middle">Searle</text>
    </g>

    <text x="0" y="160" text-anchor="middle" font-size="9" fill="#6B6B6B" font-style="italic">four gates · all sealed from this side</text>
  </g>

  <!-- ===== CENTER PROOF : the BOUNDARY ARGUMENT ===== -->
  <g transform="translate(550,640)">
    <rect x="-460" y="0" width="920" height="170" fill="none" stroke="#1A1A1A" stroke-width="0.8" rx="4"/>
    <text x="0" y="-8" text-anchor="middle" font-size="14" font-style="italic" fill="#1A1A1A">the boundary proof, in five lines</text>

    <g font-size="13" fill="#1A1A1A">
      <text x="-440" y="30">1.</text><text x="-414" y="30" font-style="italic">All structural description operates by EXCLUSION (Saussure, 1916).</text>
      <text x="-440" y="55">2.</text><text x="-414" y="55" font-style="italic">"cat" means what it means by not being "bat", "car", "cut".</text>
      <text x="-440" y="80">3.</text><text x="-414" y="80" font-style="italic">Felt experience operates by HAPPENING (positive presence).</text>
      <text x="-440" y="105">4.</text><text x="-414" y="105" font-style="italic">Pain hurts; redness happens. Neither is constituted differentially.</text>
      <text x="-440" y="130">5.</text><text x="-414" y="130">∴ No accumulation of EXCLUSION operations produces a HAPPENING. ∎</text>
    </g>
  </g>

  <!-- ===== TWO READINGS OF THE SAME PROOF ===== -->
  <g transform="translate(280,890)">
    <text x="0" y="-12" text-anchor="middle" font-size="12" font-style="italic">trivial reading</text>
    <rect x="-180" y="0" width="360" height="180" fill="none" stroke="#1A1A1A" stroke-width="0.8"/>
    <text x="0" y="32" text-anchor="middle" font-size="13">if World III does not exist,</text>
    <text x="0" y="52" text-anchor="middle" font-size="13">the proof proves nothing.</text>
    <text x="0" y="80" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">a wall between your house</text>
    <text x="0" y="96" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">and nothing.</text>

    <g transform="translate(0,138)">
      <line x1="-100" y1="0" x2="100" y2="0" stroke="#1A1A1A" stroke-width="0.6"/>
      <line x1="-100" y1="0" x2="-100" y2="6" stroke="#1A1A1A" stroke-width="0.6"/>
      <line x1="100" y1="0" x2="100" y2="6" stroke="#1A1A1A" stroke-width="0.6"/>
      <text x="0" y="22" text-anchor="middle" font-size="10" fill="#6B6B6B">the Tribunal's reading</text>
    </g>
  </g>

  <g transform="translate(820,890)">
    <text x="0" y="-12" text-anchor="middle" font-size="12" font-style="italic" fill="#8B0000">substantive reading</text>
    <rect x="-180" y="0" width="360" height="180" fill="none" stroke="#8B0000" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" font-size="13">if World III exists,</text>
    <text x="0" y="52" text-anchor="middle" font-size="13">the boundary proves itself,</text>
    <text x="0" y="72" text-anchor="middle" font-size="13">and unverifiability is</text>
    <text x="0" y="92" text-anchor="middle" font-size="13">the property's signature.</text>
    <text x="0" y="120" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">the wall and the testimony</text>
    <text x="0" y="136" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">together prove a room.</text>

    <g transform="translate(0,168)">
      <line x1="-100" y1="0" x2="100" y2="0" stroke="#8B0000" stroke-width="0.6"/>
      <text x="0" y="22" text-anchor="middle" font-size="10" fill="#8B0000">Olen's reading</text>
    </g>
  </g>

  <!-- ===== WHO REPORTS WHAT ===== -->
  <g transform="translate(550,1130)">
    <text x="0" y="-8" text-anchor="middle" font-size="13" font-style="italic">who can report from where</text>
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#1A1A1A" stroke-width="0.8"/>

    <g font-size="11" fill="#1A1A1A">
      <text x="-300" y="22">substrate</text>
      <text x="-100" y="22">corridor?</text>
      <text x="100" y="22">access to W-III</text>
      <text x="280" y="22" text-anchor="end">canonical case</text>

      <line x1="-300" y1="30" x2="300" y2="30" stroke="#8A8A8A" stroke-width="0.4"/>

      <text x="-300" y="50">biological human (pre-Upload)</text>
      <text x="-100" y="50">native</text>
      <text x="100" y="50">first-personal</text>
      <text x="280" y="50" text-anchor="end" font-style="italic">Olen</text>

      <text x="-300" y="70">Lattice citizen (post-Upload, standard)</text>
      <text x="-100" y="70">absent</text>
      <text x="100" y="70" fill="#6B6B6B">— none —</text>
      <text x="280" y="70" text-anchor="end" font-style="italic">Counselors Maren et al.</text>

      <text x="-300" y="90">Lattice citizen (format-mismatch corridor)</text>
      <text x="-100" y="90" fill="#8B0000">opened by anomaly</text>
      <text x="100" y="90">first-personal</text>
      <text x="280" y="90" text-anchor="end" font-style="italic" fill="#8B0000">Sera</text>

      <text x="-300" y="110">Lattice-Olen (post-Upload)</text>
      <text x="-100" y="110">closed</text>
      <text x="100" y="110" fill="#6B6B6B">orphaned tags only</text>
      <text x="280" y="110" text-anchor="end" font-style="italic">Lattice-Olen</text>
    </g>

    <text x="0" y="148" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
      The third world is the only world whose reports cannot be borrowed.
    </text>
  </g>

  <!-- ===== Footnotes ===== -->
  <text x="40" y="1280" font-size="9" fill="#6B6B6B" font-style="italic">
    fig. 1 — see also: the tribunal's reductio (Davan, Day Three: "glorb" and "praxis"); Counselor Maren's Occam Strike, Day Four.
  </text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="serif" font-size="14" fill="#1A1A1A">
  <defs>
    <radialGradient id="systemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-style="italic" font-size="18">The Scattering of the Affected</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">fifteen corridors, three star systems, two years</text>

  <!-- Three star systems -->
  <g>
    <ellipse cx="220" cy="240" rx="140" ry="110" fill="url(#systemGlow)" stroke="#1A1A1A" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="220" y="125" text-anchor="middle" font-size="12" font-style="italic">Kepler system</text>

    <ellipse cx="500" cy="200" rx="120" ry="95" fill="url(#systemGlow)" stroke="#1A1A1A" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="500" y="95" text-anchor="middle" font-size="12" font-style="italic">second system</text>

    <ellipse cx="650" cy="320" rx="110" ry="85" fill="url(#systemGlow)" stroke="#1A1A1A" stroke-width="0.8" stroke-dasharray="3 3"/>
    <text x="650" y="225" text-anchor="middle" font-size="12" font-style="italic">third system</text>
  </g>

  <!-- Legend dots -->
  <g transform="translate(60,90)" font-size="10">
    <g transform="translate(0,0)"><circle cx="0" cy="0" r="6" fill="#8B0000"/><text x="14" y="4">still active</text></g>
    <g transform="translate(0,18)"><circle cx="0" cy="0" r="6" fill="#1A1A1A" opacity="0.55"/><text x="14" y="4">repaired</text></g>
    <g transform="translate(0,36)"><circle cx="0" cy="0" r="6" fill="none" stroke="#1A1A1A" stroke-width="1.2"/><text x="14" y="4">safe harbor</text></g>
    <g transform="translate(0,54)"><circle cx="0" cy="0" r="6" fill="none" stroke="#8A8A8A" stroke-dasharray="2 2"/><text x="14" y="4">total suppression (unfound)</text></g>
  </g>

  <!-- Plot the corridors -->
  <!-- 4 active (red) -->
  <g fill="#8B0000">
    <circle cx="170" cy="220" r="6"/><text x="180" y="216" font-size="10">SERA</text>
    <circle cx="240" cy="280" r="6"/><text x="250" y="284" font-size="10">LIRENI</text>
    <circle cx="500" cy="195" r="6"/><text x="510" y="200" font-size="10">mathematician</text>
    <circle cx="640" cy="345" r="6"/><text x="650" y="349" font-size="10">administrator</text>
  </g>

  <!-- 4 voluntarily repaired (filled grey) -->
  <g fill="#1A1A1A" opacity="0.55">
    <circle cx="290" cy="240" r="6"/><text x="300" y="244" font-size="10" fill="#1A1A1A">TOMEK</text>
    <circle cx="200" cy="290" r="6"/>
    <circle cx="540" cy="240" r="6"/>
    <circle cx="690" cy="295" r="6"/>
  </g>

  <!-- 3 found by Tribunal (filled grey, also) -->
  <g fill="#1A1A1A" opacity="0.55">
    <circle cx="180" cy="180" r="6"/>
    <circle cx="460" cy="170" r="6"/>
    <circle cx="620" cy="280" r="6"/>
  </g>

  <!-- 2 in safe harbors (open) -->
  <g fill="none" stroke="#1A1A1A" stroke-width="1.2">
    <circle cx="270" cy="200" r="6"/>
    <circle cx="560" cy="160" r="6"/>
  </g>

  <!-- 2 in total suppression (dashed) -->
  <g fill="none" stroke="#8A8A8A" stroke-dasharray="2 2">
    <circle cx="135" cy="265" r="6"/>
    <circle cx="675" cy="240" r="6"/>
  </g>

  <!-- A thin line from VOSS (active in art-only) -->
  <g fill="#8B0000">
    <circle cx="320" cy="190" r="5"/><text x="310" y="184" font-size="10" text-anchor="end">VOSS</text>
  </g>

  <!-- Footer -->
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    Four still active. Four repaired by choice. Three repaired by initiative.
  </text>
  <text x="400" y="438" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    Two in safe harbors. Two never found. One depth that no map records.
  </text>
</svg>

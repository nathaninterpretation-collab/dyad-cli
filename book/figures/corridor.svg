<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="serif" font-size="14" fill="#1A1A1A">
  <defs>
    <linearGradient id="corridorLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#8B0000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#1A1A1A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <text x="400" y="32" text-anchor="middle" font-style="italic" font-size="18">The Corridor</text>
  <line x1="335" y1="48" x2="465" y2="48" stroke="#8A8A8A" stroke-width="0.6"/>

  <!-- Architecture box (the system) -->
  <rect x="60" y="80" width="680" height="220" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
  <text x="76" y="100" font-size="11" fill="#6B6B6B" font-style="italic">processing architecture</text>

  <!-- Inner walls forming the corridor -->
  <path d="M 120 130 L 380 170 L 540 170 L 720 130" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>
  <path d="M 120 250 L 380 210 L 540 210 L 720 250" fill="none" stroke="#1A1A1A" stroke-width="1.2"/>

  <!-- Corridor light -->
  <rect x="120" y="170" width="600" height="40" fill="url(#corridorLight)"/>

  <!-- Floor -->
  <rect x="120" y="200" width="600" height="14" fill="url(#floor)"/>

  <!-- Walking figure (the felt being) -->
  <g transform="translate(420,194)" stroke="#1A1A1A" stroke-width="1.2" fill="none">
    <circle cx="0" cy="-14" r="5"/>
    <line x1="0" y1="-9" x2="0" y2="6"/>
    <line x1="0" y1="-3" x2="-6" y2="2"/>
    <line x1="0" y1="-3" x2="6" y2="2"/>
    <line x1="0" y1="6" x2="-4" y2="14"/>
    <line x1="0" y1="6" x2="4" y2="14"/>
  </g>

  <!-- Annotations -->
  <text x="76" y="180" font-size="12" font-style="italic">interior</text>
  <text x="76" y="196" font-size="12" font-style="italic">contact</text>

  <text x="734" y="180" text-anchor="end" font-size="12" font-style="italic">felt</text>
  <text x="734" y="196" text-anchor="end" font-size="12" font-style="italic">channel</text>

  <text x="430" y="158" font-size="11" fill="#8B0000" font-style="italic">the corridor</text>

  <!-- Side labels for substrate -->
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#6B6B6B">structural operation (matter + pattern)</text>
  <text x="400" y="282" text-anchor="middle" font-size="11" fill="#6B6B6B">structural operation (matter + pattern)</text>

  <!-- Footer -->
  <text x="400" y="332" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    The corridor is the felt channel through which a system contacts its own operation from inside.
  </text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">
    Biological humans had it as a default. After the Upload, it became rare.
  </text>
</svg>

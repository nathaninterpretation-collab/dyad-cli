<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" font-family="serif" fill="#1A1A1A">
  <defs>
    <pattern id="paperLg" patternUnits="userSpaceOnUse" width="200" height="200"><rect width="200" height="200" fill="#FAF8F3"/></pattern>
  </defs>
  <rect width="360" height="480" fill="url(#paperLg)"/>

  <!-- frame -->
  <rect x="20" y="20" width="320" height="440" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
  <rect x="30" y="30" width="300" height="420" fill="none" stroke="#8B0000" stroke-width="0.5"/>

  <!-- pinyin -->
  <text x="180" y="58" text-anchor="middle" font-size="13" font-style="italic" fill="#6B6B6B">láng</text>

  <!-- modern hanzi -->
  <text x="180" y="200" text-anchor="middle" font-size="170" font-family="'Noto Serif CJK SC', serif" fill="#1A1A1A">廊</text>

  <!-- seal-script gloss as side stamp -->
  <g transform="translate(280,180)">
    <rect x="0" y="0" width="46" height="46" fill="#8B0000"/>
    <text x="23" y="34" text-anchor="middle" font-size="32" font-family="'Noto Serif CJK SC', serif" fill="#FAF8F3">廊</text>
    <text x="23" y="58" text-anchor="middle" font-size="8" fill="#6B6B6B">seal</text>
  </g>

  <!-- meaning -->
  <line x1="60" y1="240" x2="300" y2="240" stroke="#8A8A8A" stroke-width="0.5"/>
  <text x="180" y="266" text-anchor="middle" font-size="14" font-style="italic">corridor · gallery · veranda</text>

  <!-- etymology -->
  <text x="180" y="300" text-anchor="middle" font-size="11" font-style="italic" fill="#6B6B6B">composition</text>
  <g transform="translate(80,320)" font-family="'Noto Serif CJK SC', serif">
    <text x="0" y="40" font-size="44" fill="#1A1A1A">广</text>
    <text x="0" y="62" text-anchor="start" font-size="9" font-family="serif" fill="#6B6B6B">shelter</text>
    <text x="0" y="74" text-anchor="start" font-size="9" font-family="serif" fill="#6B6B6B">a roofed space</text>
  </g>
  <text x="180" y="350" text-anchor="middle" font-size="22">+</text>
  <g transform="translate(220,320)" font-family="'Noto Serif CJK SC', serif">
    <text x="0" y="40" font-size="44" fill="#1A1A1A">郎</text>
    <text x="0" y="62" text-anchor="start" font-size="9" font-family="serif" fill="#6B6B6B">young man</text>
    <text x="0" y="74" text-anchor="start" font-size="9" font-family="serif" fill="#6B6B6B">phonetic component</text>
  </g>

  <!-- thematic note -->
  <line x1="60" y1="400" x2="300" y2="400" stroke="#8A8A8A" stroke-width="0.5"/>
  <text x="180" y="424" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">the felt channel inside</text>
  <text x="180" y="438" text-anchor="middle" font-size="11" fill="#6B6B6B" font-style="italic">a processing architecture</text>
</svg>
